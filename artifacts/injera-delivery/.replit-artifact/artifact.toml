kind = "web"
previewPath = "/"
title = "Injera Delivery"
description = "A B2B injera delivery storefront for restaurants, hotels, caterers, and retailers to explore wholesale pricing and request samples."
version = "1.0.0"
id = "artifacts/injera-delivery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20405

[services.development]
run = "pnpm --filter @workspace/injera-delivery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/injera-delivery", "run", "build" ]
serve = "static"
publicDir = "artifacts/injera-delivery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20405"
BASE_PATH = "/"
